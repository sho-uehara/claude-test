<!doctype html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>DASH BREAK</title>
<style>
  html, body {

  }

    position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;

  }

<body>
<canvas id="c" aria-label="DASH BREAK"></canvas>
<div id="sa"></div>
<noscript>JavaScript を有効にしてください</noscript>
<script>
(() => {
'use strict';

/* =========================================================
   ユーティリティ
   ========================================================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const easeOut = u => 1 - (1 - u) * (1 - u);              // ダッシュの速度カーブ
const easeOutInv = v => 1 - Math.sqrt(Math.max(0, 1 - v)); // その逆関数
const easeOut3 = k => 1 - (1 - k) * (1 - k) * (1 - k);
const fmt = n => String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const FONT = 'system-ui,-apple-system,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,Roboto,sans-serif';
const TEST = location.hash.indexOf('test') >= 0;
let reduceMotion = false;
try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

/* =========================================================
   調整値
   ========================================================= */
const CFG = {
  PR: 14,              // 自機の半径（ワールド単位）
  KILL_R: 18,          // ダッシュで敵を砕く幅（自機側。見た目より広め）
  HURT_R: 9,           // 被弾の幅（自機側。見た目より狭め）
  LAND_R: 28,          // 着地点のまわりで砕く幅（止まった直後の理不尽な被弾を防ぐ）
  EDGE: 14,            // ダッシュの終点を画面の縁から離す幅
  BOUNCE_ZONE: 52,     // 縁からこの幅の中で止まりそうなときは、壁で跳ね返る
  BOUNCE_TO: 88,       // 跳ね返った先（縁からの距離）。画面外から来る敵にいきなり触れないように
  BOUNCE_DUR: 0.085,
  RECOVER: 0.15,       // ダッシュ後に止まる時間（秒）
  DASH_SPEED: 2600, DASH_MIN: 0.07, DASH_MAX: 0.14,
  INV_HURT: 1.4, INV_START: 0.8,
  HS_FIRST: 0.055, HS_NEXT: 0.032, HS_CAP: 0.17, HS_HURT: 0.13, HS_BIG: 0.06, HS_DIE: 0.2,
  SHAKE_PX: 13, SHAKE_ROT: 0.014, // 揺れの上限（CSS px / ラジアン）
  MAX_ENEMIES: 100,
  RESULT_LOCK: 0.55,   // リザルトの誤タップ防止
};
const ETYPE = {
  grunt: { r: 15, spd: 1.0,  steer: 2.3, pts: 10, color: '#ff3d7f', dark: '#7a1240' },
  dart:  { r: 11, spd: 1.75, steer: 0.9, pts: 15, color: '#ffb02e', dark: '#7a4a00' },
  brute: { r: 26, spd: 0.62, steer: 1.5, pts: 30, color: '#b56cff', dark: '#45197f' },
};
const C_PLAYER = '#3df0ff', C_RED = '#ff2a4a', C_GOLD = '#ffe45c', C_BG = '#070914';
// 難易度カーブ [経過秒, 値]
const K_INT = [[0, 1.7], [15, 1.15], [40, 0.8], [70, 0.55], [100, 0.32], [130, 0.2], [160, 0.11], [200, 0.06]];
const K_SPD = [[0, 54], [15, 72], [40, 98], [70, 122], [100, 158], [130, 200], [160, 265], [200, 340]];
function curve(t, K) {
  if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) {
    if (t <= K[i][0]) { const a = K[i - 1], b = K[i]; return lerp(a[1], b[1], (t - a[0]) / (b[0] - a[0])); }
  }
  return K[K.length - 1][1];
}

/* =========================================================
   キャンバスと画面サイズ
   ========================================================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false }) || cv.getContext('2d');
const saEl = document.getElementById('sa');
let cssW = 1, cssH = 1, dpr = 1, S = 1, W = 420, H = 760, ui = 1;
const safe = { t: 0, r: 0, b: 0, l: 0 };
let vigGrad = null, redGrad = null;

const player = {
  x: 210, y: 420, r: CFG.PR, st: 'idle', bounced: false, sx: 0, sy: 0, tx: 0, ty: 0, len: 1, dur: 0.1, u: 0,
  ang: -Math.PI / 2, dirX: 0, dirY: -1, kills: 0, hs: 0, rec: 0, inv: 0, hurtBlink: 0,
  sq: 1, sqV: 0, dead: false, streak: null,
};

function resize() {
  cssW = Math.max(1, cv.clientWidth || window.innerWidth || 1);
  cssH = Math.max(1, cv.clientHeight || window.innerHeight || 1);
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const pw = Math.max(1, Math.round(cssW * dpr)), ph = Math.max(1, Math.round(cssH * dpr));
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  S = Math.min(cssW / 420, cssH / 760);       // ワールド→CSS px の倍率
  W = cssW / S; H = cssH / S;                 // ワールドの広さ（短辺がおよそ420〜760）
  ui = clamp(Math.min(cssW / 390, cssH / 720), 0.75, 1.6);
  try {
    const cs = getComputedStyle(saEl);
    safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
    safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) {}
  const cx = cssW / 2, cy = cssH / 2, far = Math.hypot(cssW, cssH) * 0.62;
  vigGrad = ctx.createRadialGradient(cx, cy, Math.min(cssW, cssH) * 0.32, cx, cy, far);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)'); vigGrad.addColorStop(1, 'rgba(0,0,0,0.45)');
  redGrad = ctx.createRadialGradient(cx, cy, Math.min(cssW, cssH) * 0.25, cx, cy, far);
  redGrad.addColorStop(0, 'rgba(255,30,60,0)'); redGrad.addColorStop(1, 'rgba(255,30,60,0.75)');
  player.x = clamp(player.x, CFG.PR, W - CFG.PR); player.y = clamp(player.y, CFG.PR, H - CFG.PR);
}
function checkResize() {
  const w = cv.clientWidth, h = cv.clientHeight, d = Math.min(window.devicePixelRatio || 1, 3);
  if ((w && w !== cssW) || (h && h !== cssH) || d !== dpr) resize();
}

/* =========================================================
   音（すべて Web Audio API で合成）
   ========================================================= */
const A = (() => {
  let ac = null, master = null, noiseBuf = null;
  function create() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ac = new AC({ latencyHint: 'interactive' }); } catch (e) { try { ac = new AC(); } catch (e2) { ac = null; return false; } }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5;
    comp.attack.value = 0.002; comp.release.value = 0.15;
    master = ac.createGain(); master.gain.value = 0.6;
    master.connect(comp); comp.connect(ac.destination);
    const len = Math.floor(ac.sampleRate * 0.7);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  // ユーザー操作のたびに呼ぶ。ブラウザは操作の中でしか音を開始させてくれない
  function unlock() {
    if (!create()) return;
    if (ac.state !== 'running') {
      try { const p = ac.resume && ac.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
      try { // 古いiOS向け：無音を1回鳴らして解錠する
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
        s.buffer = b; s.connect(ac.destination); s.start(0);
      } catch (e) {}
    }
  }
  function suspend() { if (ac && ac.state === 'running' && ac.suspend) ac.suspend().catch(() => {}); }
  function resume() { if (ac && ac.state === 'suspended' && ac.resume) ac.resume().catch(() => {}); }
  const ok = () => !!ac && ac.state !== 'closed';
  const now = () => ac.currentTime;
  function tone(type, f0, f1, t, atk, dec, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + atk + dec);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + atk + dec);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + atk + dec + 0.03);
  }
  function noise(t, dur, vol, type, f0, f1, q) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q || 0.8;
    f.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    const off = Math.random() * Math.max(0, noiseBuf.duration - dur - 0.06);
    s.start(t, off, dur + 0.05);
  }
  return { unlock, suspend, resume, ok, now, tone, noise, state: () => (ac ? ac.state : 'none') };
})();

// コンボが続くほど上がる音階（ペンタトニック）
const PENT = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
function pitchFor(c) {
  const i = Math.max(0, c - 1);
  if (i < PENT.length) return PENT[i];
  return (i - PENT.length) % 2 ? 36 : 33;
}
const noteHz = semi => 261.63 * Math.pow(2, semi / 12);
let killSfxBudget = 3;      // 1フレームに鳴らす破砕音の上限（音割れ防止）
let sfxCount = 0;
const sfx = {
  can() { return !demo && A.ok(); },
  dash() {
    if (!this.can()) return; const t = A.now(); sfxCount++;
    A.noise(t, 0.14, 0.2, 'bandpass', 3800, 500, 1.4);
    A.tone('sine', 240, 80, t, 0.002, 0.08, 0.16);
  },
  kill(c, big) {
    if (!this.can()) return; const t = A.now(); sfxCount++;
    const f = noteHz(pitchFor(c));
    A.tone('triangle', f, f, t, 0.002, 0.2, 0.28);
    A.tone('square', f * 2, f * 2, t, 0.001, 0.05, 0.045);
    A.noise(t, 0.07, 0.28, 'highpass', 2200, 5000, 0.7);
    A.tone('sine', big ? 130 : 190, 42, t, 0.002, big ? 0.2 : 0.11, big ? 0.6 : 0.42);
    if (c >= 10) A.tone('sine', f * 3, f * 3, t + 0.012, 0.002, 0.14, Math.min(0.09, 0.012 * (c - 8)));
  },
  land() {
    if (!this.can()) return; const t = A.now();
    A.tone('sine', 520, 170, t, 0.001, 0.05, 0.07);
  },
  bounce() {
    if (!this.can()) return; const t = A.now();
    A.tone('square', 300, 140, t, 0.001, 0.05, 0.06);
    A.noise(t, 0.05, 0.12, 'bandpass', 1400, 700, 1.5);
  },
  multi(c, n) {
    if (!this.can()) return; const t = A.now() + 0.03;
    const f = noteHz(Math.min(pitchFor(c), 24));
    const steps = [1, 1.26, 1.5, 2, 2.52];
    for (let i = 0; i < Math.min(5, n + 1); i++) {
      A.tone('triangle', f * steps[i], f * steps[i], t + i * 0.035, 0.002, 0.16, 0.12);
      A.tone('square', f * steps[i] * 2, f * steps[i] * 2, t + i * 0.035, 0.001, 0.04, 0.025);
    }
  },
  miss() {
    if (!this.can()) return; const t = A.now();
    A.tone('triangle', 200, 120, t, 0.002, 0.09, 0.12);
  },
  hurt() {
    if (!this.can()) return; const t = A.now();
    A.tone('sawtooth', 200, 50, t, 0.003, 0.4, 0.2);
    A.tone('square', 120, 40, t, 0.003, 0.3, 0.1);
    A.noise(t, 0.35, 0.45, 'lowpass', 1800, 150, 0.9);
    A.tone('sine', 90, 28, t, 0.002, 0.35, 0.55);
  },
  start() {
    if (!A.ok()) return; const t = A.now();
    const ns = [523.25, 659.25, 783.99, 1046.5];
    for (let i = 0; i < ns.length; i++) {
      A.tone('triangle', ns[i], ns[i], t + i * 0.045, 0.002, 0.15, 0.18);
      A.tone('square', ns[i], ns[i], t + i * 0.045, 0.002, 0.05, 0.03);
    }
    A.noise(t, 0.25, 0.12, 'bandpass', 600, 4000, 1.2);
  },
  over() {
    if (!A.ok()) return; const t = A.now();
    A.noise(t, 0.9, 0.5, 'lowpass', 2500, 60, 0.8);
    A.tone('sine', 110, 25, t, 0.002, 0.7, 0.6);
    const ns = [392, 329.63, 261.63, 196];
    for (let i = 0; i < ns.length; i++) A.tone('triangle', ns[i], ns[i] * 0.98, t + 0.18 + i * 0.13, 0.003, 0.3, 0.2);
  },
  best() {
    if (!A.ok()) return; const t = A.now();
    const ns = [1046.5, 1318.5, 1568, 2093];
    for (let i = 0; i < ns.length; i++) A.tone('triangle', ns[i], ns[i], t + i * 0.06, 0.002, 0.2, 0.12);
  },
  blip() {
    if (!A.ok()) return; const t = A.now();
    A.tone('triangle', 880, 880, t, 0.002, 0.06, 0.12);
  },
};

/* =========================================================
   振動（対応端末のみ）
   ========================================================= */
const canVib = typeof navigator.vibrate === 'function';
let vibLast = 0, vibCount = 0;
function vib(pattern, force) {
  if (!canVib || demo) return;
  const n = performance.now();
  if (!force && n - vibLast < 35) return;
  vibLast = n; vibCount++;
  try { navigator.vibrate(pattern); } catch (e) {}
}

/* =========================================================
   ゲームの状態
   ========================================================= */
let state = 'title';        // title | play | dying | result | paused
let stateT = 0;             // 今の画面に入ってからの実時間
let demo = true;            // タイトル画面の自動デモ中
let gameT = 0;              // プレイ開始からのゲーム内時間
let hitstop = 0, timeScale = 1;
let trauma = 0, shakeT = 0, shakeX = 0, shakeY = 0, shakeR = 0, punchX = 0, punchY = 0;
let flashWhite = 0, flashRed = 0, gridPulse = 0;
let score = 0, dispScore = 0, combo = 0, maxCombo = 0, kills = 0, lives = 3;
let comboS = 1, comboV = 0, comboA = 0, comboShown = 0, scoreS = 1, scoreV = 0;
const lifePop = [0, 0, 0];
let best = 0;
try { best = parseInt(localStorage.getItem('dashbreak.best') || '0', 10) || 0; } catch (e) {}
let newBest = false;
let taught = false, hurtTaught = false;
let banner = '', bannerT = 0;
let pendingTap = null;
let spawnClock = 0, firstWave = false, demoClock = 0, aiT = 0;
let deathWave = null;
let quality = 1, ftAvg = 16.7;

const enemies = [];
const parts = [], ppool = [];     // 破片・火花
const PMAX = 650;
const GMAX = 180;                 // 残像
const ghosts = []; for (let i = 0; i < GMAX; i++) ghosts.push({ x: 0, y: 0, a: 0, life: 0, max: 1 });
let gHead = 0;
const rings = [], flashes = [], texts = [], streaks = [];

/* =========================================================
   エフェクト
   ========================================================= */
function newPart() {
  if (parts.length >= PMAX * quality) return parts[(Math.random() * parts.length) | 0]; // 上限時は古いものを上書き
  const p = ppool.pop() || {};
  parts.push(p); return p;
}
function shatter(x, y, color, r, n, dx, dy, power) {
  const ns = Math.max(4, Math.round(n * quality));
  const sz = Math.sqrt(r / 15);
  for (let i = 0; i < ns; i++) {
    const p = newPart(); p.kind = 0;
    const a = Math.random() * TAU, sp = rand(110, 520) * power, push = rand(60, 420) * power;
    p.x = x + Math.cos(a) * r * 0.4; p.y = y + Math.sin(a) * r * 0.4;
    p.vx = Math.cos(a) * sp + dx * push; p.vy = Math.sin(a) * sp + dy * push;
    p.rot = rand(0, TAU); p.vr = rand(-18, 18);
    p.size = (i < 3 ? rand(9, 13) : rand(3.5, 8)) * sz; p.life = p.max = rand(0.4, 0.8);
    p.color = Math.random() < 0.22 ? '#ffffff' : color; p.drag = rand(3.2, 5);
  }
  const nk = Math.max(2, Math.round(n * 0.45 * quality));
  for (let i = 0; i < nk; i++) {
    const p = newPart(); p.kind = 1;
    const a = Math.random() * TAU, sp = rand(450, 1100) * power;
    p.x = x; p.y = y; p.vx = Math.cos(a) * sp + dx * 250; p.vy = Math.sin(a) * sp + dy * 250;
    p.rot = 0; p.vr = 0; p.size = rand(1.5, 2.6); p.life = p.max = rand(0.12, 0.28);
    p.color = '#ffffff'; p.drag = 7;
  }
}
function puff(x, y, dx, dy, n, color) {
  const m = Math.max(2, Math.round(n * quality));
  for (let i = 0; i < m; i++) {
    const p = newPart(); p.kind = 2;
    const a = Math.atan2(dy, dx) + Math.PI + rand(-1.1, 1.1), sp = rand(60, 220);
    p.x = x; p.y = y; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
    p.rot = 0; p.vr = 0; p.size = rand(1.5, 3.5); p.life = p.max = rand(0.2, 0.4);
    p.color = color || C_PLAYER; p.drag = 5;
  }
}
function addRing(x, y, r0, r1, dur, color, w, a) {
  if (rings.length > 60) rings.shift();
  rings.push({ x, y, r0, r1, t: 0, max: dur, color, w, a: a == null ? 1 : a });
}
function addGhostLine(x0, y0, x1, y1, ang) {
  const d = Math.hypot(x1 - x0, y1 - y0);
  const step = quality < 0.8 ? 15 : 9;
  const n = Math.min(40, Math.ceil(d / step));
  for (let i = 1; i <= n; i++) {
    const g = ghosts[gHead]; gHead = (gHead + 1) % GMAX;
    const k = i / n; g.x = x0 + (x1 - x0) * k; g.y = y0 + (y1 - y0) * k; g.a = ang;
    g.life = g.max = 0.17;
  }
}
function addText(x, y, str, color, size) {
  if (texts.length > 8) texts.shift();
  texts.push({ x: clamp(x, 70, W - 70), y: clamp(y, 90, H - 40), str, color, size, t: 0, max: 0.9, s: 0.2, v: 14 });
}

/* =========================================================
   敵の出現
   ========================================================= */
function edgePoint(side, along, margin) {
  const m = margin == null ? 30 : margin;
  if (side === 'top') return { x: lerp(30, W - 30, along), y: -m, nx: 0, ny: 1 };
  if (side === 'bottom') return { x: lerp(30, W - 30, along), y: H + m, nx: 0, ny: -1 };
  if (side === 'left') return { x: -m, y: lerp(90, H - 60, along), nx: 1, ny: 0 };
  return { x: W + m, y: lerp(90, H - 60, along), nx: -1, ny: 0 };
}
// 自機に近すぎる辺は避ける（画面外から出た直後にぶつからないように）
function pickSide(not) {
  let s = 'top';
  for (let k = 0; k < 6; k++) {
    let r = Math.random() * (2 * W + 2 * H);
    if ((r -= W) < 0) s = 'top'; else if ((r -= W) < 0) s = 'bottom'; else if ((r -= H) < 0) s = 'left'; else s = 'right';
    if (s === not) continue;
    const d = s === 'top' ? player.y : s === 'bottom' ? H - player.y : s === 'left' ? player.x : W - player.x;
    if (d > 160) return s;
  }
  return s;
}
function rimPoint(a, m) {
  const c = Math.cos(a), s = Math.sin(a);

  const motionK = (state === 'title' ? 0.35 : 1) * (reduceMotion ? 0.4 : 1);
  trauma = Math.max(0, trauma - rdt * 2.2);
  shakeT += rdt;
  const amp = CFG.SHAKE_PX * Math.min(1, trauma) * motionK;
  shakeX = amp * (Math.sin(shakeT * 71.3) * 0.6 + Math.sin(shakeT * 127.9 + 1.7) * 0.4) + punchX * motionK;
  shakeY = amp * (Math.sin(shakeT * 83.1 + 0.6) * 0.6 + Math.sin(shakeT * 113.7 + 2.9) * 0.4) + punchY * motionK;
  const m = Math.hypot(shakeX, shakeY), lim = CFG.SHAKE_PX + 2;
  if (m > lim) { shakeX *= lim / m; shakeY *= lim / m; }
  shakeR = CFG.SHAKE_ROT * Math.min(1, trauma) * Math.sin(shakeT * 47.1) * motionK;
  const pk = Math.exp(-rdt * 16); punchX *= pk; punchY *= pk;
  flashWhite = Math.max(0, flashWhite - rdt * 5);
  flashRed = Math.max(0, flashRed - rdt * 2.4);
  gridPulse = Math.max(0, gridPulse - rdt * 4);
  // HUD のばね
  let a = -400 * (comboS - 1) - 18 * comboV; comboV += a * rdt; comboS += comboV * rdt;
  a = -500 * (scoreS - 1) - 22 * scoreV; scoreV += a * rdt; scoreS += scoreV * rdt;
  comboA = combo >= 2 ? Math.min(1, comboA + rdt * 12) : Math.max(0, comboA - rdt * 3.5);
  dispScore += (score - dispScore) * (1 - Math.exp(-rdt * 14));
  if (Math.abs(score - dispScore) < 1) dispScore = score;
  for (let i = 0; i < 3; i++) lifePop[i] = Math.max(0, lifePop[i] - rdt * 2.2);
  if (bannerT > 0) bannerT -= rdt;
  for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].t += rdt; if (flashes[i].t > 0.13) flashes.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i]; t.t += rdt;
    const aa = -360 * (t.s - 1) - 13 * t.v; t.v += aa * rdt; t.s += t.v * rdt; t.y -= 26 * rdt;
    if (t.t > t.max) texts.splice(i, 1);
  }
  // ゲームオーバー演出：衝撃波で残りの敵を砕いてからリザルトへ
  if (state === 'dying') {
    if (deathWave) {
      deathWave.r += rdt * 1300;
      for (const e of enemies) {
        if (!e.alive) continue;
        const dx = e.x - deathWave.x, dy = e.y - deathWave.y;
        if (dx * dx + dy * dy < deathWave.r * deathWave.r) {
          e.alive = false;
          const d = Math.hypot(dx, dy) || 1;
          shatter(e.x, e.y, e.color, e.r, 6, dx / d, dy / d, 0.8);
        }
      }
    }
    if (stateT > 0.55) timeScale = Math.min(1, timeScale + rdt * 2);
    if (stateT > 1.05) toResult();
  }
  killSfxBudget = 3;
}

    case 'play': requestDash(x, y); break;

function onPointerDown(e) {

  const ty = cssH * 0.25 + Math.sin(t * 2.2) * 3 * ui;
  const big = Math.round(76 * ui);
  ctx.save(); ctx.translate(cx, ty); ctx.rotate(-0.06);
  txt('DASH', 4 * ui, -36 * ui + 4 * ui, big, '#ff3d7f', 900, cssW - 40);
  txt('DASH', 0, -36 * ui, big, '#ffffff', 900, cssW - 40);
  txt('BREAK', 4 * ui, 38 * ui + 4 * ui, big, C_PLAYER, 900, cssW - 40);
  txt('BREAK', 0, 38 * ui, big, '#ffffff', 900, cssW - 40);
  ctx.restore();
  const y2 = cssH * 0.47;
  txt('タップした場所へ一瞬で突進。', cx, y2, Math.round(17 * ui), '#ffffff', 800, cssW - 32, 5);
  txt('通り道の敵をまとめて砕け！', cx, y2 + 28 * ui, Math.round(17 * ui), '#ffffff', 800, cssW - 32, 5);
  txt('止まっている間に触れると −1（3回でおわり）', cx, y2 + 62 * ui, Math.round(13 * ui), '#9aa3cc', 700, cssW - 32, 4);
  const pulse = 0.7 + 0.3 * Math.sin(t * 5);
  ctx.globalAlpha = pulse;
  txt('TAP TO START', cx, cssH * 0.76, Math.round(24 * ui), C_PLAYER, 900, cssW - 40, 5);
  ctx.globalAlpha = 1;
  if (best > 0) txt('BEST ' + fmt(best), cx, cssH * 0.76 + 40 * ui, Math.round(14 * ui), '#9aa3cc', 800, cssW - 40, 4);
}
function drawResult() {
  const k = Math.min(1, stateT / 0.22);
  ctx.globalAlpha = 1;
  ctx.fillStyle = `rgba(7,9,20,${(0.72 * k).toFixed(3)})`; ctx.fillRect(0, 0, cssW, cssH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cx = cssW / 2, slide = (1 - easeOut3(k)) * 30 * ui;
  let y = cssH * 0.2 + slide;
  ctx.globalAlpha = k;
  txt('GAME OVER', cx, y, Math.round(24 * ui), '#ff3d7f', 900, cssW - 40, 5);
  y += 62 * ui;
  txt('SCORE', cx, y, Math.round(13 * ui), '#9aa3cc', 800);
  const cnt = score * easeOut3(Math.min(1, stateT / 0.45));
  y += 46 * ui;
  txt(fmt(cnt), cx, y, Math.round(64 * ui), '#ffffff', 900, cssW - 40, 6);
  y += 50 * ui;
  if (newBest) {
    ctx.globalAlpha = k * (0.7 + 0.3 * Math.sin(stateT * 10));
    txt('NEW BEST!', cx, y, Math.round(20 * ui), C_GOLD, 900, cssW - 40, 4);
    ctx.globalAlpha = k;
  } else if (best > 0) {
    txt('BEST ' + fmt(best), cx, y, Math.round(14 * ui), '#9aa3cc', 800);
  }
  // 最大コンボ・砕いた数・時間
  y += 66 * ui;
  const colW = Math.min(cssW / 3, 130 * ui);
  const items = [['MAX COMBO', String(maxCombo), comboColor(maxCombo)], ['BREAK', String(kills), '#ffffff'],
    ['TIME', Math.floor(gameT / 60) + ':' + String(Math.floor(gameT % 60)).padStart(2, '0'), '#ffffff']];
  for (let i = 0; i < 3; i++) {
    const x = cx + (i - 1) * colW;
    txt(items[i][0], x, y, Math.round(11 * ui), '#9aa3cc', 800, colW - 8);
    txt(items[i][1], x, y + 30 * ui, Math.round(i === 0 ? 34 * ui : 26 * ui), items[i][2], 900, colW - 8, 4);
  }
  const ready = stateT > CFG.RESULT_LOCK;
  ctx.globalAlpha = ready ? 0.78 + 0.22 * Math.sin(stateT * 5) : 0.15;
  txt('TAP TO RETRY', cx, cssH * 0.8, Math.round(24 * ui), C_PLAYER, 900, cssW - 40, 5);
  ctx.globalAlpha = 1;
}
function drawPaused() {
  ctx.fillStyle = 'rgba(7,9,20,0.7)'; ctx.fillRect(0, 0, cssW, cssH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  txt('PAUSE', cssW / 2, cssH * 0.42, Math.round(40 * ui), '#ffffff', 900);
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(stateT * 5);
  txt('TAP TO RESUME', cssW / 2, cssH * 0.55, Math.round(22 * ui), C_PLAYER, 900);
  ctx.globalAlpha = 1;
}
const wm = [1, 0, 0, 1, 0, 0];   // ワールド座標→画面の変換（揺れ込み）
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = C_BG; ctx.fillRect(0, 0, cv.width, cv.height);
  // ワールド（揺れつき）
  const cs = Math.cos(shakeR), sn = Math.sin(shakeR), cx = cssW / 2, cy = cssH / 2;
  wm[0] = dpr * S * cs; wm[1] = dpr * S * sn; wm[2] = -dpr * S * sn; wm[3] = dpr * S * cs;
  wm[4] = dpr * (cx - (cs * cx - sn * cy) + shakeX); wm[5] = dpr * (cy - (sn * cx + cs * cy) + shakeY);
  ctx.setTransform(wm[0], wm[1], wm[2], wm[3], wm[4], wm[5]);
  drawGrid();
  if (!player.dead) {
    ctx.globalCompositeOperation = 'lighter';
    glow(GLOW.player, player.x, player.y, 230, 0.07);
    ctx.globalCompositeOperation = 'source-over';
  }
  drawStreaksGhosts();
  drawRings();
  drawEnemies();
  drawFlashes();
  drawParticles();
  drawPlayer();
  drawEdgeMarkers();
  // 画面に固定
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = vigGrad; ctx.fillRect(0, 0, cssW, cssH);
  // 文字は周辺減光の上に描く（暗くならないように）
  ctx.setTransform(wm[0], wm[1], wm[2], wm[3], wm[4], wm[5]);
  drawHint();
  drawTexts();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (flashRed > 0) { ctx.globalAlpha = Math.min(1, flashRed) * (reduceMotion ? 0.4 : 0.8); ctx.fillStyle = redGrad; ctx.fillRect(0, 0, cssW, cssH); }
  if (flashWhite > 0) { ctx.globalAlpha = Math.min(0.5, flashWhite); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cssW, cssH); }
  ctx.globalAlpha = 1;
  if (state === 'play' || state === 'dying' || state === 'paused') drawHUD();
  if (state === 'title') drawTitle();
  else if (state === 'result') drawResult();
  else if (state === 'paused') drawPaused();
}

/* =========================================================
   メインループ
   ========================================================= */
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let rdt = (ts - lastTs) / 1000; lastTs = ts;
  if (!(rdt >= 0)) rdt = 0;
  if (rdt < 0.1) {
    ftAvg += (rdt * 1000 - ftAvg) * 0.05;
    if (ftAvg > 24 && quality > 0.55) quality = 0.55;                  // 重い端末では粒子を減らす
    else if (ftAvg < 18 && quality < 1) quality = Math.min(1, quality + rdt * 0.1);
  }
  rdt = Math.min(rdt, 0.05);
  checkResize();
  stateT += rdt;
  realUpdate(rdt);
  if (state !== 'paused' && !(TEST && window.__db && window.__db.freeze)) {
    let sdt = rdt;
    if (hitstop > 0) {                      // ヒットストップ：ゲーム内の時間を止める
      hitstop -= rdt;
      sdt = hitstop < 0 ? -hitstop : 0;
      if (hitstop < 0) hitstop = 0;
    }
    sdt *= timeScale;
    while (sdt > 1e-6) {
      const st = Math.min(sdt, 1 / 60);
      update(st); sdt -= st;
      if (hitstop > 0) break;
    }
  }
  render();
}

resize();
startTitle();
requestAnimationFrame(frame);

/* テスト用（URL に #test を付けたときだけ） */
if (TEST) {
  window.__db = {
    freeze: false,
    get state() { return state; }, get player() { return player; }, get enemies() { return enemies; },
    get W() { return W; }, get H() { return H; }, get S() { return S; }, get dpr() { return dpr; },
    get gameT() { return gameT; }, get lives() { return lives; }, get score() { return score; },
    get combo() { return combo; }, get maxCombo() { return maxCombo; }, get kills() { return kills; },
    get parts() { return parts.length; }, get quality() { return quality; }, get hitstop() { return hitstop; },
    get trauma() { return trauma; }, get shake() { return [shakeX, shakeY, shakeR]; },
    get audio() { return A.state(); }, get sfxCount() { return sfxCount; }, get vibCount() { return vibCount; },
    get taught() { return taught; }, get stateT() { return stateT; },
    start: startGame, tap: requestDash, step: update, title: startTitle,
  };
}
})();
</script>
